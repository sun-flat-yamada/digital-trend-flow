name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 同じ ref の古い実行は取り消す (PR への連続 push など)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Type check, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 設定を import 時に検証するため必要。実際の API は呼ばない
      GEMINI_API_KEY: dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high and above)
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Validate config
        run: npm run test:config

      - name: Unit tests
        run: npx jest --forceExit

      - name: Build
        run: npm run build

  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
