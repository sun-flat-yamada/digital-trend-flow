name: Deploy GitHub Pages
# Manually deploy or deploy when pages generator / templates change

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/publishing/pages_generator.ts"
      - "src/cli/build_pages.ts"
      - ".github/workflows/pages.yml"

env:
  ARTIFACTS_REPO: ${{ vars.ARTIFACTS_REPO || format('{0}/artifacts', github.repository_owner) }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout artifacts
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: ${{ env.ARTIFACTS_REPO }}
          token: ${{ secrets.PAT_GITHUB || github.token }}
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          OUTPUT_LANGUAGE: ${{ vars.OUTPUT_LANGUAGE || 'en' }}
          SUMMARY_LANGUAGE: ${{ vars.SUMMARY_LANGUAGE || '' }}
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
