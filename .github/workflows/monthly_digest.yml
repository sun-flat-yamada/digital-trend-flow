name: Monthly Trend Digest

on:
  # 毎月1日の JST 04:30 (UTC 19:30 前日) に実行
  schedule:
    - cron: "30 19 1 * *"
  workflow_dispatch:

env:
  ARTIFACTS_REPO: "sun-flat-yamada/artifacts"

permissions:
  contents: write

jobs:
  monthly-digest:
    name: Generate Monthly Digest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAT_GITHUB }}
          fetch-depth: 0

      - name: Checkout artifacts
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: ${{ env.ARTIFACTS_REPO }}
          token: ${{ secrets.PAT_GITHUB }}
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Generate monthly digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTE_API_TOKEN: ${{ secrets.NOTE_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          LAST_MONTH=$(date -d "last month" '+%Y-%m')
          echo "Generating monthly digest for: $LAST_MONTH"
          npm run build && node -e "
            const { generateMonthlyDigest } = require('./dist/aggregation/monthly_digest');
            generateMonthlyDigest('$LAST_MONTH')
              .then(result => {
                if (result) {
                  console.log('Monthly digest generated:', result);
                } else {
                  console.log('No daily summaries found for $LAST_MONTH');
                }
              })
              .catch(err => {
                console.error('Monthly digest failed:', err);
                process.exit(1);
              });
          "

      - name: Commit monthly report to artifacts repo
        run: |
          cd artifacts/
          if [ ! -d .git ]; then
            git init
            git branch -M main
            git remote add origin https://oauth2:${{ secrets.PAT_GITHUB }}@github.com/${{ env.ARTIFACTS_REPO }}.git
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add contents/digital-trend/collection/monthly/ || true
          git diff --staged --quiet || git commit -m "chore: monthly digest $(date -u '+%Y-%m')"
          git push -u origin main
