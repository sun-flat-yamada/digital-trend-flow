# ==========================================
# Dependabot Configuration
# ==========================================
# Automatically opens PRs for dependency updates.
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # ── GitHub Actions ─────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Group all Actions updates into a single PR (low risk)
      all-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # ── npm Dependencies ───────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 15
    groups:
      # Group minor + patch into one PR (usually safe)
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Major updates get individual PRs (may contain breaking changes)
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: "deps"
