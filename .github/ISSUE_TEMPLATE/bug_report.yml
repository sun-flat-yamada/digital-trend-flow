name: "🐛 Bug Report"
description: "パイプライン・レポート・配信の不具合を報告する"
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **注意**: API キー・トークン・Webhook URL・個人情報を書かない。ログは貼る前にマスクする。
  - type: input
    id: run
    attributes:
      label: "対象の実行 / コミット"
      description: "GitHub Actions の実行 URL、またはコミット SHA。"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: "対象"
      options:
        - "Daily パイプライン (daily_summary.yml)"
        - "Weekly / Monthly / Yearly レポート"
        - "収集 (ingestion)"
        - "配信 (Discord / Slack / Teams / Email / note / Zenn / Pages)"
        - "CI / 開発ツール"
        - "その他"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "現象"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "再現手順"
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "期待する動作"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "ログ"
      description: "関連するワークフローのログ（秘密情報はマスクする）。"
      render: shell
